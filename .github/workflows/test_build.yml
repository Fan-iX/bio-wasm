name: Test build

on:
  push:
    branches:
      - main

jobs:
  publish:
    name: Test build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Create dist directory
        run: mkdir ./dist

      - name: Copy static files
        run: cp -r ./package.json ./js -t ./dist/

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autopoint

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          registry-url: 'https://registry.npmjs.org'
          node-version: 24

      - name: Setup emscripten
        uses: mymindstorm/setup-emsdk@v12

      - name: Setup cmake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Build blast
        uses: ./.github/actions/build-blast

      - name: Build wasm.js
        working-directory: dist/wasm
        run: ls **/*.js | sed 's/.js//' | awk "{print \"export { default as '\"\$0\"' } from '../wasm/\"\$0\".js';\" }" > ../js/wasm.js

      - name: Build manifest
        run: python ../build_manifest.py wasm > manifest.json
        working-directory: dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: production-files
          path: ./dist
