name: Test build

on:
  push:
    branches:
      - main

jobs:
  build-1:
    name: Test build set 1
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Create dist directory
        run: mkdir ./dist

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          registry-url: 'https://registry.npmjs.org'
          node-version: 24

      - name: Setup emscripten
        uses: emscripten-core/setup-emsdk@v15

      - name: Build seqtk
        uses: ./.github/actions/build-seqtk

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-set-1
          path: ./dist

  build-2:
    name: Test build set 2
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Create dist directory
        run: mkdir ./dist

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          registry-url: 'https://registry.npmjs.org'
          node-version: 24

      - name: Setup emscripten
        uses: emscripten-core/setup-emsdk@v15

      - name: Build vcftools
        uses: ./.github/actions/build-vcftools

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-set-2
          path: ./dist

  publish:
    needs: [build-1, build-2]
    name: Test publish
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Create dist directory
        run: mkdir ./dist

      - name: Copy static files
        run: cp -r ./package.json ./js -t ./dist/

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          path: ./dist
          pattern: build-set-*
          merge-multiple: true

      - name: Build wasm.js
        working-directory: dist/wasm
        run: ls **/*.js | sed 's/.js//' | awk "{print \"export { default as '\"\$0\"' } from '../wasm/\"\$0\".js';\" }" > ../js/wasm.js

      - name: Build manifest
        run: python ../build_manifest.py wasm > manifest.json
        working-directory: dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: production-files
          path: ./dist
