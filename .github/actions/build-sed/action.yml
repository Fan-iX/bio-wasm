name: Build
description: Build sed
runs:
  using: "composite"
  steps:
    - name: Clone
      shell: bash
      run: mkdir -p sed && wget https://ftp.gnu.org/gnu/sed/sed-4.10.tar.gz -qO - | tar xvz --strip-components=1 -C sed

    - name: Configure
      shell: bash
      working-directory: sed
      run: emconfigure ./configure --host=none CFLAGS="-O0" ac_cv_have_decl_alarm=no gl_cv_func_sleep_works=yes --disable-threads

    - name: Build
      shell: bash
      working-directory: sed
      run: make -j$(nproc) EXEEXT=.js sed/sed.js CFLAGS="-O3 -DNDEBUG" LDFLAGS="-s EXPORT_ES6=1 -s MODULARIZE=1 -s ALLOW_MEMORY_GROWTH=1 -s EXPORTED_RUNTIME_METHODS=[\"callMain\",\"FS\"] -s ENVIRONMENT=[\"web\"]"

    - name: Make dist directory
      shell: bash
      run: mkdir -p dist/wasm/sed

    - name: Copy artifacts to dist
      shell: bash
      run: cp sed/sed/sed.js sed/sed/sed.wasm -t dist/wasm/sed/
